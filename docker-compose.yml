name: lab11-security

services:
  app:
    image: lab11-hardened-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LAB10_SECRET_BACKEND: env
      PYTHONDONTWRITEBYTECODE: "1"
    # No host-published ports. Only Nginx can reach the internal Flask service.
    expose:
      - "8000"
    networks:
      - backend
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 80
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  proxy:
    image: nginx/nginx-unprivileged:1.30.6
    user: "101:101"
    depends_on:
      app:
        condition: service_healthy
    # Only your own computer can open the demo. Never publish to 0.0.0.0.
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      - edge
      - backend
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - lab11_tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 80
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  lab11_tls:
    external: true
